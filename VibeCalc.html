<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 50px auto; }
        input, button { padding: 10px; margin: 5px; width: calc(50% - 20px); box-sizing: border-box; }
        #result { margin-top: 20px; font-size: 1.2em; color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h2>Простой калькулятор</h2>
    <input type="number" id="num1" placeholder="Число 1">
    <input type="number" id="num2" placeholder="Число 2">
    <button onclick="calculate()">Сложить</button>
    <button onclick="clearFields()">Очистить</button>
    <div id="result"></div>

    <script>
        function calculate() {
            const n1 = document.getElementById('num1').value;
            const n2 = document.getElementById('num2').value;
            const resultDiv = document.getElementById('result');

            if (n1 === '' || n2 === '' || isNaN(n1) || isNaN(n2)) {
                resultDiv.textContent = 'Введите два числа';
                resultDiv.className = 'error';
            } else {
                const sum = parseFloat(n1) + parseFloat(n2);
                resultDiv.textContent = 'Результат: ' + sum;
                resultDiv.className = '';
            }
        }

        function clearFields() {
            document.getElementById('num1').value = '';
            document.getElementById('num2').value = '';
            document.getElementById('result').textContent = '';
            document.getElementById('result').className = '';
        }
    </script>
</body>
</html>
